<text x="32" y="475" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">At a 200 m preference, neither route matches. The bench route adds 90 m.</text>
<text x="32" y="535" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Inspect access to the stop, show when it was checked, and record return arrangements before saving.</text>

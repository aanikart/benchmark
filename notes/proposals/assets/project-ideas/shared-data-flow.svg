<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Shared foundation / where the information goes</title><desc id="desc">Public context and private records use separate flows. Privileged work is handled on the server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#246b69"/></marker></defs>
<rect width="960" height="550" rx="20" fill="#faf9f5"/>
<text x="32" y="42" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Shared foundation / where the information goes</text>
<text x="32" y="71" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Arrows show information flow, not automatic permission to share private records</text>
<rect x="32" y="104" width="256" height="148" rx="14" fill="#eaf3f0" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="52" y="137" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Phone interface</text>
<text x="52" y="168" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Main task and local draft</text>
<text x="52" y="194" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Clear save / retry state</text>
<text x="52" y="220" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Accessible text alternative</text>
<rect x="352" y="104" width="256" height="148" rx="14" fill="#eaf0f7" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="372" y="137" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Context request</text>
<text x="372" y="168" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Public service or server</text>
<text x="372" y="194" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Minimum necessary inputs</text>
<text x="372" y="220" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">No private notes or video</text>
<rect x="672" y="104" width="256" height="148" rx="14" fill="#eaf3f0" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="692" y="137" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Updated interface</text>
<text x="692" y="168" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Show source and time</text>
<text x="692" y="194" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Explain unavailable data</text>
<text x="692" y="220" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Preserve the person’s work</text>
<path d="M 300 178 L 340 178" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 620 178 L 660 178" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="324" width="256" height="145" rx="14" fill="white" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="52" y="357" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Signed-in account</text>
<text x="52" y="388" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Own records only</text>
<text x="52" y="414" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Stable IDs prevent duplicates</text>
<text x="52" y="440" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Recoverable local draft</text>
<rect x="352" y="324" width="256" height="145" rx="14" fill="white" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="372" y="357" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Access checks</text>
<text x="372" y="388" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Owner rules for records</text>
<text x="372" y="414" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Server keeps privileged keys</text>
<text x="372" y="440" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Reject unauthorized requests</text>
<rect x="672" y="324" width="256" height="145" rx="14" fill="#f5ead5" stroke="#c7d4d5" stroke-width="1.5"/>
<text x="692" y="357" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Private persistence</text>
<text x="692" y="388" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Supabase records and files</text>
<text x="692" y="414" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Move in View: video worker</text>
<text x="692" y="440" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Clean up temporary copies</text>
<path d="M 300 396 L 340 396" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 620 396 L 660 396" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 160 264 L 160 312" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="32" y="527" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">A saved comparison retains source IDs so edits or deletion can update its dependent copies.</text>
</svg>
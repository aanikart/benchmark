<path d="M 90 120 L 90 164" fill="none" stroke="#246b69" stroke-width="4" stroke-linecap="round"/>
<path d="M 101 142 L 101 164" fill="none" stroke="#246b69" stroke-width="4" stroke-linecap="round"/>
<text x="52" y="201" fill="#213a43" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Preview a gentle beat</text>
<text x="52" y="236" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Choose tempo and sound</text>
<text x="52" y="261" fill="#52666c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">before you start moving.</text>
<path d="M 300 198 L 340 198" fill="none" stroke="#246b69" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="100" width="256" height="197" rx="14" fill="white" stroke="#c7d4d5" stroke-width="1.5"/>
<path d="M 376 158 C 379 121, 420 164, 422 124" fill="none" stroke="#246b69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
